<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Cuesheet</title>
  <meta name="description" content="Mark and revisit key moments in your audio recordings." />

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#15161a" />

  <!-- iOS home-screen / standalone-app behavior (Safari does not read manifest for these) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cuesheet" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Favicon -->
  <link rel="icon" href="favicon.png" type="image/png" />

  <!-- Styles -->
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="library.css" />
  <link rel="stylesheet" href="timeline.css" />
  <link rel="stylesheet" href="timestamps.css" />
  <link rel="stylesheet" href="player.css" />
</head>
<body>

  <div id="app">

    <!-- ============ LIBRARY VIEW ============ -->
    <section id="view-library" class="view is-active" aria-label="Library">
      <header class="view-header">
        <h1>Cuesheet</h1>
      </header>

      <div class="view-body">
        <button id="btn-load-file" class="btn btn-accent btn-load" type="button">
          + Load Audio File
        </button>
        <input id="file-input" type="file" accept="audio/*,.mp3,.wav" hidden />

        <button id="btn-import-cuesheet" class="btn btn-secondary btn-import" type="button">
          Import Cue Sheet
        </button>
        <input id="cuesheet-import-input" type="file" accept="application/json,.json" hidden />

        <p id="library-status" class="library-status text-muted"></p>

        <div id="library-list-wrap">
          <h2 class="section-label">Recent files</h2>
          <ul id="library-list" class="library-list">
            <!-- Populated by library-view.js. Placeholder state below. -->
            <li class="library-empty text-muted">
              No files yet — load an audio file to get started.
            </li>
          </ul>
        </div>
      </div>
    </section>

    <!-- ============ PLAYER VIEW ============ -->
    <section id="view-player" class="view" aria-label="Player">
      <header class="view-header player-header">
        <button id="btn-back-to-library" class="btn btn-icon no-select" type="button" aria-label="Back to library">
          ‹
        </button>
        <h1 id="player-filename" class="player-filename">No file loaded</h1>
        <button id="btn-export-cuesheet" class="btn btn-share no-select" type="button" aria-label="Share cue sheet" disabled>
          Share
        </button>
      </header>

      <div class="view-body player-body">
        <div class="timeline-wrap">
          <div id="timeline" class="timeline no-select">
            <div id="timeline-scrub-label" class="timeline-scrub-label" aria-hidden="true"></div>
            <div class="timeline-track">
              <div class="timeline-progress"></div>
              <div class="timeline-markers"></div>
              <div class="timeline-playhead"></div>
            </div>
          </div>
          <div class="timeline-times mono">
            <span id="time-current">0:00</span>
            <span id="time-duration">0:00</span>
          </div>
          <div class="timeline-zoom-row">
            <button id="btn-zoom-out" class="btn btn-icon no-select" type="button" aria-label="Zoom out" disabled>−</button>
            <span id="zoom-level-label" class="mono zoom-level-label">1×</span>
            <button id="btn-zoom-in" class="btn btn-icon no-select" type="button" aria-label="Zoom in" disabled>+</button>
          </div>
        </div>

        <div class="player-transport">
          <button id="btn-play-pause" class="btn btn-accent btn-play no-select" type="button" aria-label="Play">
            <span aria-hidden="true">▶</span>
          </button>
        </div>

        <p id="player-status" class="player-status text-muted" role="status"></p>

        <button id="btn-add-timestamp" class="btn btn-accent btn-add-timestamp no-select" type="button" disabled>
          + Add Timestamp
        </button>

        <section class="timestamp-list-wrap">
          <h2 class="section-label">Timestamps</h2>
          <ul id="timestamp-list" class="timestamp-list">
            <li class="timestamp-empty text-muted">
              No timestamps yet — tap "+ Add Timestamp" while listening.
            </li>
          </ul>
        </section>
      </div>
    </section>

  </div>

  <!-- ============ TIMESTAMP EDITOR (bottom sheet) ============ -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <div id="timestamp-editor" class="sheet" role="dialog" aria-modal="true" aria-label="Edit timestamp" hidden>
    <div class="sheet-handle no-select"></div>

    <div class="sheet-header">
      <input id="editor-time-input" class="mono sheet-time-input" type="text" inputmode="decimal" aria-label="Timestamp time" value="0:00.00" />
      <button id="btn-editor-done" class="btn btn-accent" type="button">Done</button>
    </div>
    <p id="editor-time-error" class="editor-time-error" role="alert"></p>

    <label class="field-label" for="editor-title-input">Title</label>
    <input id="editor-title-input" class="field-input" type="text" maxlength="120" autocomplete="off" />

    <label class="field-label" for="editor-comment-input">Comment</label>
    <textarea id="editor-comment-input" class="field-input field-textarea" rows="3" maxlength="1000"></textarea>

    <div class="nudge-row">
      <span class="nudge-label text-muted">Adjust time</span>
      <div class="nudge-buttons">
        <button class="btn btn-icon nudge-btn" type="button" data-nudge="-1">−1s</button>
        <button class="btn btn-icon nudge-btn" type="button" data-nudge="-0.1">−0.1s</button>
        <button class="btn btn-icon nudge-btn" type="button" data-nudge="-0.01">−0.01s</button>
        <button class="btn btn-icon nudge-btn" type="button" data-nudge="0.01">+0.01s</button>
        <button class="btn btn-icon nudge-btn" type="button" data-nudge="0.1">+0.1s</button>
        <button class="btn btn-icon nudge-btn" type="button" data-nudge="1">+1s</button>
      </div>
    </div>

    <div class="countoff-row">
      <div class="countoff-toggle-row">
        <span class="countoff-toggle-text">
          <span class="field-label countoff-toggle-label">Metronome Count-off</span>
          <span class="text-muted countoff-sublabel">8 clicks before this section plays</span>
        </span>
        <button id="editor-countoff-toggle" type="button" class="toggle-switch" role="switch" aria-checked="false" aria-label="Metronome count-off">
          <span class="toggle-knob"></span>
        </button>
      </div>

      <div id="countoff-details" class="countoff-details" hidden>
        <label class="field-label" for="editor-bpm-input">Tempo (BPM)</label>
        <div class="countoff-bpm-row">
          <input id="editor-bpm-input" class="field-input mono countoff-bpm-input" type="number" min="20" max="300" step="1" inputmode="numeric" />
          <button id="btn-detect-tempo" class="btn btn-icon countoff-detect-btn" type="button">Detect</button>
        </div>
        <p id="countoff-status" class="countoff-status text-muted"></p>
      </div>
    </div>

    <button id="btn-editor-delete" class="btn btn-danger btn-delete-timestamp" type="button">
      Delete Timestamp
    </button>
  </div>

  <audio id="audio-el" preload="metadata"></audio>

  <script type="module" src="app.js"></script>
</body>
</html>
